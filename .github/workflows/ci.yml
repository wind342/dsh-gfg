name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm demo
      - name: Install official Harness CLI for profile smoke
        run: |
          mkdir -p .profile-smoke/runtime
          printf '{"private":true}\n' > .profile-smoke/runtime/package.json
          pnpm --dir .profile-smoke/runtime add @deepseek-ai/dsh@0.2.0-rc.2
      - name: Verify official profile install
        run: pnpm profile:smoke .profile-smoke/runtime/node_modules/@deepseek-ai/dsh/lib/bin.js
      - run: pnpm verify
